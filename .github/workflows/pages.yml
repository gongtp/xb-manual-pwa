name: 发布离线资料库
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'lib/**'
      - 'db/**'
      - 'pwa/**'
      - 'data/**'
      - 'public/**'
      - 'build/**'
      - 'scripts/**'
      - 'tests/**'
      - 'drizzle/**'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - 'tsconfig*.json'
      - 'vite*.config.*'
      - 'next.config.*'
      - 'next-env.d.ts'
      - 'postcss.config.*'
      - 'tailwind.config.*'
      - 'drizzle.config.*'
      - '.github/workflows/pages.yml'
      - '!**/*.md'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm run test:pwa
        env:
          PWA_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pwa
      - uses: actions/deploy-pages@v4
        id: deployment
